# Publishes dashboard/ and, under /guide/, docs/build-guide/ to GitHub Pages. In the
# repository's Settings > Pages, set the
# source to "GitHub Actions" once.
name: Dashboard

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
      - "docs/build-guide/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put the site together
        run: |
          mkdir _site
          cp -r dashboard/. _site/
          cp -r docs/build-guide _site/guide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
