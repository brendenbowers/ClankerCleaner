# ClankerCleaner settings (Raspberry Pi).
# Copy to /etc/clanker-cleaner/config.toml, or pass --config <path>.
# Every key is optional; anything left out uses the built-in default shown here.
# Command-line options override this file.

[logging]
# trace, debug, info, warn, err, critical or off
level = "info"
# Rotating log file alongside the console; leave out for console only.
# file = "/var/log/clanker-cleaner/clanker-cleaner.log"

[gpio]
# Line (BCM GPIO) numbers, not physical header pins.
dirty_tank_sensor_pin = 22   # header pin 15
clean_tank_high_sensor_pin = 26   # header pin 37
clean_tank_low_sensor_pin = 23    # header pin 16
# Level sensor output: "npn" (pulls LOW when wet; 10k pull-up to 3.3 V) or
# "pnp" (drives HIGH when wet; 10k to the GPIO, then 15k to GND).
dirty_tank_sensor_output = "npn"
clean_tank_high_sensor_output = "npn"
clean_tank_low_sensor_output = "npn"
pump_relay_pin = 17         # header pin 11, relay IN1
dirty_tank_rinse_relay_pin = 27   # header pin 13, relay IN2
clean_tank_fill_relay_pin = 5     # header pin 29, relay IN3
cleaner_dosing_relay_pin = 6      # header pin 31, relay IN4
# true if the relay board's trigger jumper is on L
relay_active_low = false

[dirty_tank]
# How long the pump runs each time the tank is emptied, 1 to 3600.
pump_run_seconds = 240
# How long the rinse solenoid stays open each time the tank is rinsed, 1 to 300.
rinse_seconds = 15
# How long the pump runs to empty the tank after each rinse, 1 to 3600.
rinse_pump_run_seconds = 60
# How long the full operation (empty, rinse and refill) may run in total, 1 to 7200.
fill_operation_seconds = 600
# How long the sensor must hold a new reading before it's acted on, 0 to 600.
# Stops water sloshing past the sensor from starting the pump.
sensor_debounce_seconds = 20

[clean_tank]
# How long the sensor must hold a new reading before it's acted on, 0 to 600.
sensor_debounce_seconds = 20
# How long the fill relay stays on each time the tank is filled, 1 to 3600.
fill_run_seconds = 120
# How long the dosing pump runs to add detergent each time the tank is filled, 1 to 300.
# At about 100 mL/min, 9 seconds is roughly 15 mL.
detergent_run_seconds = 9

[dreame]
# Reads the robot's and dock's state (cleaning, clean tank empty, dirty tank full) from
# the MovaHome or DreameHome cloud. The password is stored here in plain text, so keep
# this file private: sudo chmod 600 /etc/clanker-cleaner/config.toml
enabled = false
# mova (MovaHome app) or dreame (DreameHome app)
account = "mova"
username = ""
password = ""
# Server region chosen in the app: us, eu, cn, ...
country = "us"
# Device ID or name as shown in the app; leave empty for the first robot vacuum.
device = ""
# How often to poll, 10 to 3600.
poll_seconds = 30
# Get changes pushed the way the app does (MQTT); polling drops to every 5 minutes while
# pushes arrive. Turn off if the push connection misbehaves.
push = true
